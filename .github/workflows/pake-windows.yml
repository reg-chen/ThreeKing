name: Build ThreeKing Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ThreeKing
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Pake CLI
        shell: pwsh
        run: |
          $version = (Get-Content .github/pake-version.txt -Raw).Trim()
          npm install --global "pake-cli@$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache compiled Pake Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: C:/npm/prefix/node_modules/pake-cli/src-tauri
          key: pake-windows-${{ hashFiles('.github/pake-version.txt') }}
          cache-all-crates: true

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pake . --name ThreeKing --icon "https://cdn-icons-png.flaticon.com/512/850/850960.png" --width 390 --height 800 --min-width 390 --min-height 580 --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem -Path . -Recurse -File -Filter '*.msi' |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]|[\\/]target[\\/]debug[\\/]' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'Pake produced no Windows MSI installer.' }
          Copy-Item -LiteralPath $installer.FullName -Destination 'release/ThreeKing.msi' -Force
          Get-Item 'release/ThreeKing.msi' | Select-Object Name, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ThreeKing-Windows-x64
          path: release/ThreeKing.msi
          archive: false
          if-no-files-found: error
          retention-days: 30
