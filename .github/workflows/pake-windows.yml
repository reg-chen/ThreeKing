name: Build ThreeKing Windows

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: threeking-installer-artifact
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ThreeKing
        uses: actions/checkout@v5

      - name: Checkout patched Pake source
        uses: actions/checkout@v5
        with:
          repository: reg-chen/Pake
          ref: 547387a556aa5097f5ec2e3a4d7c7970d1c22cc7
          path: pake-source

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build patched Pake CLI from fork
        shell: pwsh
        working-directory: pake-source
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm run cli:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --global .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache compiled Pake Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: C:/npm/prefix/node_modules/pake-cli/src-tauri
          key: pake-fork-547387a-windows
          cache-all-crates: true

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pake . --name ThreeKing --icon "https://cdn-icons-png.flaticon.com/512/850/850960.png" --width 390 --height 800 --min-width 390 --min-height 580 --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem -Path . -Recurse -File -Filter '*.msi' |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]|[\\/]target[\\/]debug[\\/]' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'Pake produced no Windows MSI installer.' }
          Copy-Item -LiteralPath $installer.FullName -Destination 'release/ThreeKing.msi' -Force
          Get-Item 'release/ThreeKing.msi' | Select-Object Name, Length

      - name: Upload Windows installer
        id: uploaded_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ThreeKing-Windows-x64
          path: release/ThreeKing.msi
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Keep only the latest successful build artifact
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const names = ["ThreeKing-Windows-x64","ThreeKing.msi"];
            const keepId = Number('${{ steps.uploaded_artifact.outputs.artifact-id }}');
            if (!Number.isSafeInteger(keepId) || keepId <= 0) {
              core.setFailed('Upload action returned no valid artifact ID; no cleanup performed.');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const current = artifacts.find(a => a.id === keepId);
            if (!current || current.workflow_run?.id !== context.runId) {
              core.setFailed('New upload artifact not found for this run; no cleanup performed.');
              return;
            }
            const old = artifacts.filter(a => a.id !== keepId && names.includes(a.name) && !a.expired);
            for (const artifact of old) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
              core.info(`Deleted old artifact ${artifact.name} (${artifact.id})`);
            }
            core.info(`Retained artifact ${current.name} (${keepId}); deleted ${old.length} older artifacts.`);

      - name: Publish latest MSI as a single rolling Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'latest'
          $title = 'ThreeKing Windows (Latest)'
          $notes = "Automatically updated from successful Windows build ${{ github.run_number }} (${{ github.sha }})."
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'release/ThreeKing.msi' --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace MSI in latest release.' }
            gh release edit $tag --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update latest release.' }
          } else {
            gh release create $tag 'release/ThreeKing.msi' --target $env:GITHUB_SHA --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create latest release.' }
          }

      - name: Remove older Releases and their release tags
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const current = releases.find(r => r.tag_name === 'latest' && !r.draft);
            if (!current || !current.assets.some(a => a.name === 'ThreeKing.msi')) {
              core.setFailed('Latest release with MSI is missing; older releases were retained.');
              return;
            }
            for (const release of releases) {
              if (release.id === current.id) continue;
              await github.rest.repos.deleteRelease({owner, repo, release_id: release.id});
              core.info(`Deleted old release ${release.tag_name}`);
              if (release.tag_name && release.tag_name !== 'latest') {
                try {
                  await github.rest.git.deleteRef({owner, repo, ref: `tags/${release.tag_name}`});
                  core.info(`Deleted old release tag ${release.tag_name}`);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            core.info(`Retained only release latest (${current.id}).`);
