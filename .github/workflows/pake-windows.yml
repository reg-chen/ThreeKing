name: Build ThreeKing Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ThreeKing
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: threeking-pake-cargo-${{ runner.os }}-v1

      - name: Install Pake CLI
        run: npm install --global pake-cli

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pake . --name ThreeKing --icon "https://cdn-icons-png.flaticon.com/512/850/850960.png" --width 390 --height 800 --min-width 390 --min-height 580 --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem -Path . -Recurse -File -Filter '*.msi' |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]|[\\/]target[\\/]debug[\\/]' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'Pake produced no Windows MSI installer.' }
          Copy-Item -LiteralPath $installer.FullName -Destination 'release/ThreeKing.msi' -Force
          Get-Item 'release/ThreeKing.msi' | Select-Object Name, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ThreeKing-Windows-x64
          path: release/ThreeKing.msi
          archive: false
          if-no-files-found: error
          retention-days: 30
